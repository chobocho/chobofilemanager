# Todo #125: 모든 PR과 master 푸시를 Windows·Linux에서 검사합니다.
# 프론트(타입 검사·테스트·빌드) → Go(vet, 헤드리스 태그 포함 · 테스트).
# 페이지(src/frontend/dist)는 Go 프로그램에 들어가므로 Go보다 먼저 빌드합니다.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # 로컬과 같은 npm 11 — npm 버전이 다르면 lock 해석이 달라 npm ci가 실패 (2026-10-25)
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      # Wails v2(Linux)는 cgo로 GTK·WebKit을 씁니다
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      # 프론트가 import하는 Wails 바인딩(frontend/wailsjs)은 생성물이라 저장소에 없음 → 만들어 둠.
      # main.go의 go:embed가 frontend/dist를 요구하므로 빈 파일을 먼저 둠 (빌드 단계에서 채움)
      - name: Wails bindings
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          mkdir -p frontend/dist && touch frontend/dist/.keep
          wails generate module
      - name: Frontend
        working-directory: src/frontend
        shell: bash # Windows(pwsh)도 첫 실패에서 멈추도록
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Vet
        run: |
          go vet ./...
          go vet -tags headless ./internal/... ./cmd/...
      - name: Test
        run: go test ./...
      # 창 없는 터미널 웹 서버 (WebView2·GTK 불필요)
      - name: Headless build
        env:
          CGO_ENABLED: "0"
        run: go build -tags headless -o chobocho-term-headless ./cmd/chobocho-term
