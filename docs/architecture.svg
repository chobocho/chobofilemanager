<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="900" viewBox="0 0 1140 900" font-family="'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12.5" fill="#1f2328">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .t  { font-size: 14px; font-weight: 700; }
      .h  { font-size: 13px; font-weight: 700; }
      .m  { font-family: 'Cascadia Mono', Consolas, 'JetBrains Mono', monospace; font-size: 12px; }
      .d  { fill: #57606a; }
      .ln { stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
      .lb { font-size: 11.5px; fill: #57606a; }
    </style>
  </defs>

  <!-- 배경 (GitHub 다크 모드에서도 읽히도록 불투명) -->
  <rect x="0" y="0" width="1140" height="900" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="30" y="34" font-size="18" font-weight="700">Chobocho Commander 아키텍처</text>
  <text x="318" y="34" class="d">Wails v2 (Go + React) · 파일 관리자 + 내장 터미널 (choboTerm 통합)</text>

  <!-- ── 실행 파일 / 접속 ─────────────────────────────────────────────── -->
  <g>
    <rect x="30" y="54" width="340" height="64" rx="8" fill="#fff6e8" stroke="#c98a2b"/>
    <text x="44" y="76" class="t">chobocho-commander(.exe)</text>
    <text x="44" y="95"><tspan class="m">main.go</tspan> · Wails 창 (WebView2 / WebKitGTK)</text>
    <text x="44" y="111" class="d">파일 관리자 App + 터미널 Host를 한 창에 바인딩</text>

    <rect x="400" y="54" width="340" height="64" rx="8" fill="#fff6e8" stroke="#c98a2b"/>
    <text x="414" y="76" class="t">다른 PC의 브라우저</text>
    <text x="414" y="95">같은 페이지를 받아 터미널만 사용 (WebTerminal)</text>
    <text x="414" y="111" class="d">접속 주소에 토큰 · HTTPS 선택</text>

    <rect x="770" y="54" width="340" height="64" rx="8" fill="#fff6e8" stroke="#c98a2b"/>
    <text x="784" y="76" class="t">chobocho-term-headless</text>
    <text x="784" y="95"><tspan class="m">cmd/chobocho-term</tspan> · <tspan class="m">-tags headless</tspan></text>
    <text x="784" y="111" class="d">창 없이 터미널 웹 서버만 (--headless)</text>
  </g>

  <!-- ── 프론트엔드 ─────────────────────────────────────────────────────── -->
  <rect x="30" y="150" width="1050" height="268" rx="10" fill="#eef4ff" stroke="#4a72c4"/>
  <text x="46" y="173" class="t" fill="#2a4f9e">프론트엔드</text>
  <text x="130" y="173" class="d"><tspan class="m">src/frontend</tspan> · React 18 · Zustand · Vite</text>

  <rect x="46" y="184" width="1018" height="32" rx="6" fill="#ffffff" stroke="#9fb6e3"/>
  <text x="60" y="205"><tspan class="m" font-weight="700">App.jsx</tspan>  —  Files / FTP / Terminal 보기 전환 + 하단 터미널 도크 (F9) · 전역 단축키 · 대화상자 · 웹 화면이면 터미널만</text>

  <!-- 파일 관리자 -->
  <rect x="46" y="226" width="500" height="146" rx="8" fill="#ffffff" stroke="#9fb6e3"/>
  <text x="60" y="248" class="h">파일 관리자</text>
  <text x="60" y="270"><tspan class="m">components/</tspan></text>
  <text x="74" y="288">FilePanel (이중 패널·탭) · Toolbar · FKeyBar · StatusBar</text>
  <text x="74" y="305">FileViewer (텍스트·이미지·마크다운) · TextEditor (CodeMirror 6)</text>
  <text x="74" y="322">FTPManager · 검색 · 북마크 · 복사/이동 충돌 · 명령 실행 창</text>
  <text x="60" y="344"><tspan class="m">stores/</tspan></text>
  <text x="74" y="362">fileStore · editorStore · ftpStore · dockStore · themeStore</text>

  <!-- 터미널 -->
  <rect x="564" y="226" width="500" height="146" rx="8" fill="#ffffff" stroke="#9fb6e3"/>
  <text x="578" y="248" class="h">터미널</text>
  <text x="634" y="248" class="d"><tspan class="m">terminal/</tspan> · 처음 열 때 지연 로딩 · xterm.js 6</text>
  <text x="578" y="270"><tspan class="m">components/</tspan> TerminalWorkspace · TerminalDock · RemoteFiles</text>
  <text x="592" y="288">ConnectDialog · SessionManager · PrefsDialog · ScriptBox …</text>
  <text x="578" y="308"><tspan class="m">store/</tspan> termStore · filesStore · scriptStore · termEvents</text>
  <text x="578" y="328"><tspan class="m">core/</tspan> 프레임워크 무관 TypeScript</text>
  <text x="592" y="346">session · layout(분할) · prefs · remoteFiles · forwards</text>
  <text x="592" y="363">docker · luaScript · macros · i18n · helpText · termApi</text>

  <rect x="46" y="380" width="1018" height="28" rx="6" fill="#dfe8fa" stroke="#9fb6e3"/>
  <text x="60" y="399"><tspan class="m">wailsjs/</tspan> 바인딩 (창 안)   ⇄   <tspan class="m">internal/web/web_shim.js</tspan> (브라우저: 같은 API·이벤트를 WebSocket으로)</text>

  <!-- ── 백엔드 ─────────────────────────────────────────────────────────── -->
  <rect x="30" y="462" width="1050" height="296" rx="10" fill="#eef8f0" stroke="#3f8f5a"/>
  <text x="46" y="485" class="t" fill="#2c6b41">백엔드</text>
  <text x="104" y="485" class="d"><tspan class="m">src</tspan> · Go 1.26</text>

  <!-- package main -->
  <rect x="46" y="496" width="340" height="208" rx="8" fill="#ffffff" stroke="#93c5a4"/>
  <text x="60" y="518" class="h">package main</text>
  <text x="160" y="518" class="d">파일 관리자 Go-JS API</text>
  <text x="60" y="540"><tspan class="m" font-weight="700">App</tspan> <tspan class="m">app.go</tspan></text>
  <text x="60" y="560"><tspan class="m" font-weight="700">FileManager</tspan></text>
  <text x="74" y="577" class="m">filemanager · fileops · filetext</text>
  <text x="74" y="593" class="m">filearchive(ZIP) · fileshell</text>
  <text x="74" y="609" class="m">filebookmarks · settings · transfer</text>
  <text x="60" y="631"><tspan class="m" font-weight="700">FTPManager</tspan> <tspan class="m">ftpmanager.go</tspan> (jlaffaye/ftp)</text>
  <text x="60" y="651">Starlark 실행 (go.starlark.net)</text>
  <text x="60" y="671">OS별: <tspan class="m">drives_* · trash_* · open_*</tspan></text>
  <text x="60" y="691" class="d">휴지통 · 드라이브 · 기본 앱으로 열기</text>

  <!-- internal/termapp -->
  <rect x="404" y="496" width="660" height="208" rx="8" fill="#ffffff" stroke="#93c5a4"/>
  <text x="418" y="518" class="h"><tspan class="m">internal/termapp</tspan> · Host</text>
  <text x="600" y="518" class="d">터미널 탭·연결·파일 전송·뷰어·포워딩·도커·Lua·웹 호스트</text>

  <rect x="418" y="530" width="310" height="76" rx="6" fill="#f3fbf5" stroke="#b5dcc1"/>
  <text x="430" y="549" class="h">연결</text>
  <text x="430" y="567"><tspan class="m">sshconn</tspan> 키·에이전트·ssh_config·ProxyJump</text>
  <text x="430" y="584"><tspan class="m">telnet</tspan> · <tspan class="m">serial</tspan> · <tspan class="m">localshell</tspan></text>
  <text x="430" y="600" class="d">로컬 셸: ConPTY (Windows) / pty (Linux)</text>

  <rect x="740" y="530" width="310" height="76" rx="6" fill="#f3fbf5" stroke="#b5dcc1"/>
  <text x="752" y="549" class="h">파일 전송 · 서버</text>
  <text x="752" y="567"><tspan class="m">transfer</tspan> SFTP · SCP · FTP(S) · Zmodem</text>
  <text x="752" y="584"><tspan class="m">web</tspan> HTTP + WebSocket, 토큰, TLS</text>
  <text x="752" y="600" class="d">(창의 설정에서 켜거나 헤드리스로)</text>

  <rect x="418" y="616" width="310" height="76" rx="6" fill="#f3fbf5" stroke="#b5dcc1"/>
  <text x="430" y="635" class="h">Lua</text>
  <text x="430" y="653"><tspan class="m">luahost</tspan> (gopher-lua)</text>
  <text x="430" y="670">같은 exe를 <tspan class="m">--lua-host</tspan>로 다시 실행</text>
  <text x="430" y="686" class="d">별도 프로세스 · 메모리 256MB 제한</text>

  <rect x="740" y="616" width="310" height="76" rx="6" fill="#f3fbf5" stroke="#b5dcc1"/>
  <text x="752" y="635" class="h">설정 · 저장</text>
  <text x="752" y="653" class="m">config · store · appdir · sessionlog</text>
  <text x="752" y="670"><tspan class="m">secret</tspan> 비밀번호 (DPAPI / 키링)</text>
  <text x="752" y="686" class="m">update · i18n · dialog</text>

  <rect x="46" y="714" width="1018" height="32" rx="6" fill="#dcefe2" stroke="#93c5a4"/>
  <text x="60" y="735">공용  <tspan class="m">internal/</tspan>   <tspan class="m">textenc</tspan> 인코딩 판별·변환(조합형 포함) · <tspan class="m">atomicfile</tspan> 원자적 저장·손상 파일 보관 · <tspan class="m">osutil</tspan> · <tspan class="m">codec</tspan> · <tspan class="m">version</tspan></text>

  <!-- ── 바깥 ───────────────────────────────────────────────────────────── -->
  <rect x="30" y="800" width="520" height="78" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="44" y="822" class="h">디스크</text>
  <text x="44" y="841"><tspan class="m">~/.chobocho-commander/</tspan> 앱 설정·패널·FTP 북마크</text>
  <text x="44" y="858"><tspan class="m">~/.chobocho-commander/term/</tspan> 터미널 설정·세션·접속 기록</text>
  <text x="44" y="874"><tspan class="m">문서\choboterm\logs</tspan> · <tspan class="m">scripts</tspan> 세션 로그 · Lua 스크립트</text>

  <rect x="590" y="800" width="520" height="78" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="604" y="822" class="h">외부</text>
  <text x="604" y="841">SSH · Telnet · FTP 서버, 시리얼 포트 (COM / ttyUSB)</text>
  <text x="604" y="858">로컬 셸 (cmd · PowerShell · pwsh · WSL)</text>
  <text x="604" y="874">Docker / Podman (SSH 서버 또는 이 PC)</text>

  <!-- ── 화살표 ─────────────────────────────────────────────────────────── -->
  <!-- 창이 페이지를 띄움 -->
  <path class="ln" d="M200,118 L200,148"/>
  <text x="208" y="138" class="lb">WebView에 페이지 표시</text>
  <!-- 브라우저 → 같은 페이지 -->
  <path class="ln" d="M570,118 L570,148"/>
  <text x="578" y="138" class="lb">web 서버가 같은 페이지 제공</text>
  <!-- 헤드리스 → termapp (오른쪽 바깥으로) -->
  <path class="ln" d="M1110,96 L1116,96 L1116,560 L1066,560"/>
  <text x="1121" y="250" class="lb" transform="rotate(90 1121 250)">termapp.Main + web</text>

  <!-- 프론트 ↔ 백엔드 -->
  <path class="ln" d="M216,410 L216,494" marker-start="url(#arr)"/>
  <text x="226" y="446" class="lb">Wails 바인딩 호출 · 이벤트</text>
  <path class="ln" d="M734,410 L734,494" marker-start="url(#arr)"/>
  <text x="744" y="440" class="lb">창: Wails 바인딩 · 이벤트</text>
  <text x="744" y="455" class="lb">브라우저: WebSocket (internal/web)</text>

  <!-- 백엔드 → 바깥 -->
  <path class="ln" d="M216,758 L216,798"/>
  <text x="226" y="782" class="lb">파일 · 설정</text>
  <path class="ln" d="M500,758 L500,798"/>
  <text x="508" y="782" class="lb">설정 · 세션 · 로그</text>
  <path class="ln" d="M850,758 L850,798"/>
  <text x="858" y="782" class="lb">연결 · 전송 · docker exec</text>
</svg>
